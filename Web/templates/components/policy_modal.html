<!-- 정책 상세 모달 -->
<div id="policyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" style="display: none;">
    <div class="bg-white rounded-xl p-8 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto relative">
        <div class="flex justify-between items-start mb-6">
            <h2 id="modalPolicyName" class="text-2xl font-bold text-gray-800"></h2>
            <button onclick="closePolicyModal()" class="text-gray-500 hover:text-gray-700 absolute top-4 right-4">
                <span class="material-icons">close</span>
            </button>
        </div>
        
        <div class="space-y-6">
            <div>
                <span id="modalPolicyCategory" class="text-sm font-medium px-3 py-1 rounded-full"></span>
            </div>
            
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">정책 설명</h3>
                <p id="modalPolicyDescription" class="text-gray-600 whitespace-pre-line"></p>
            </div>
            
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">지원 내용</h3>
                <p id="modalPolicySupport" class="text-gray-600 whitespace-pre-line"></p>
            </div>
            
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">신청 방법</h3>
                <p id="modalPolicyApplyMethod" class="text-gray-600 whitespace-pre-line"></p>
            </div>
            
            <div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">제출 서류</h3>
                <p id="modalPolicyDocuments" class="text-gray-600 whitespace-pre-line"></p>
            </div>
            
            <div class="flex justify-between text-sm text-gray-500">
                <div>
                    <span>조회수: </span>
                    <span id="modalPolicyViews"></span>
                </div>
                <div>
                    <span>신청기간: </span>
                    <span id="modalPolicyPeriod"></span>
                </div>
            </div>
            
            <div class="flex justify-end mt-6">
                <button id="modalPolicyButton" onclick="handlePolicyButtonClick()" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                </button>
            </div>
        </div>
    </div>
</div>
