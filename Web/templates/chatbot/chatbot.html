{% extends "base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/chatbot.css' %}">
{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chatbot Page</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-slate-100">
<div class="flex h-screen">
<aside class="w-72 bg-white p-4 border-r border-slate-200 flex flex-col">
<div class="flex items-center justify-end mb-6">
<button class="text-slate-500 hover:text-slate-700" id="sidebar-close-btn">
<span class="material-icons">menu_open</span>
</button>
</div>
<button class="w-full flex items-center justify-between bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 px-4 rounded-lg mb-4 text-sm font-medium">
                새 채팅 버튼
                <span class="material-icons text-base">add</span>
</button>
<div class="flex-grow overflow-y-auto space-y-2 pr-1">
<div class="p-3 rounded-lg hover:bg-slate-50 cursor-pointer">
<h3 class="font-semibold text-slate-800 text-sm">채팅 제목 3</h3>
<p class="text-xs text-slate-500">채팅 내용 3</p>
<p class="text-xs text-slate-400 mt-1">2025-05-19</p>
</div>
<div class="p-3 rounded-lg hover:bg-slate-50 cursor-pointer">
<h3 class="font-semibold text-slate-800 text-sm">채팅 제목 2</h3>
<p class="text-xs text-slate-500">채팅 내용 2</p>
<p class="text-xs text-slate-400 mt-1">2025-05-17</p>
</div>
<div class="p-3 rounded-lg hover:bg-slate-50 cursor-pointer">
<h3 class="font-semibold text-slate-800 text-sm">채팅 제목 1</h3>
<p class="text-xs text-slate-500">채팅 내용 1</p>
<p class="text-xs text-slate-400 mt-1">2025-05-15</p>
</div>
</div>
</aside>
<main class="flex-1 flex flex-col bg-white shadow-lg rounded-l-xl ml-[-1rem] z-10 relative">
<!-- 사이드바 열기 버튼 (숨겨진 상태에서만 보임) -->
<button id="sidebar-open-btn" class="absolute top-4 left-4 text-slate-500 hover:text-slate-700 bg-white hover:bg-slate-50 p-2 rounded-lg shadow-md border border-slate-200 z-20 hidden transition-colors">
<span class="material-icons">menu</span>
</button>

<div class="flex-grow flex flex-col items-center justify-center p-6">
<div class="text-center max-w-md">
<h2 class="text-xl font-semibold text-slate-800 mb-4">청년 정책 문의 챗봇 입니다! 무엇을 도와드릴까요?</h2>
<p class="text-slate-600 mb-8 text-sm">이런 질문을 자주 해요</p>
<div class="space-y-3">
<button class="w-full flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 text-slate-700 py-3 px-4 rounded-lg text-sm transition-colors">
<span>청년 지원금 신청 방법이 궁금해요.</span>
<span class="material-icons text-slate-400 text-lg">arrow_forward_ios</span>
</button>
<button class="w-full flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 text-slate-700 py-3 px-4 rounded-lg text-sm transition-colors">
<span>청년 창업 지원 정책을 알고 싶어요.</span>
<span class="material-icons text-slate-400 text-lg">arrow_forward_ios</span>
</button>
<button class="w-full flex items-center justify-between text-left bg-slate-50 hover:bg-slate-100 text-slate-700 py-3 px-4 rounded-lg text-sm transition-colors">
<span>제가 혜택 받을 수 있는 청년정책을 찾아주세요.</span>
<span class="material-icons text-slate-400 text-lg">arrow_forward_ios</span>
</button>
</div>
</div>
</div>
<div class="bg-white p-4 border-t border-slate-200">
<div class="flex items-center bg-slate-50 rounded-lg p-1">
<input class="flex-grow bg-transparent p-3 text-sm text-slate-700 focus:outline-none placeholder-slate-400" placeholder="메시지 입력..." type="text"/>
<button class="bg-blue-500 hover:bg-blue-600 text-white p-2.5 rounded-md ml-2 transition-colors">
<span class="material-icons">arrow_upward</span>
</button>
</div>
</div>
</main>
</div>
</body></html>
{% endblock %}

{% block extra_js %}
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="{% static 'js/chatbot.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% endblock %}
