{% extends 'base.html' %}
{% load static %}

{% block title %}로그인 - 청년 정책 상담 챗봇{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card login-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <img src="{% static 'images/logo.png' %}" alt="청년모아 로고" class="login-logo mb-3">
                    <h2 class="card-title">청년 정책 상담 챗봇</h2>
                    <p class="card-text">로그인하세요</p>
                </div>
                
                <div class="text-center">
                  <a href="/auth/naver" class="naver-btn">
                    <img src="{% static 'images/naver_login.png' %}" alt="네이버 로그인" class="naver-login-img">
                  </a>
                </div>

                <p class="text-center mt-3 privacy-text">
                    로그인 시 개인정보 처리방침에 동의하게 됩니다.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
