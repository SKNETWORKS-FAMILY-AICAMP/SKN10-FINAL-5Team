version: '3.8'

services:
  neo4j:
    image: neo4j:5.19 # 최신 버전으로 필요 시 변경 가능
    container_name: neo4j
    restart: unless-stopped
    ports:
      - 7474:7474    # HTTP
      - 7687:7687    # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4j1234  # 사용자명: neo4j / 비밀번호: neo4j1234
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/import

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
